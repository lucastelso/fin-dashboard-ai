[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-dashboard-ai"
version = "0.1.0"
description = "Dashboard Financeiro Inteligente - Backend"
requires-python = ">=3.12, <3.13"
dependencies = [
    # Web Framework & Async I/O
    "fastapi",
    "uvicorn[standard]",

    # Database & ORM
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg",
    "alembic",

    # Data Processing & ML
    "polars",
    "pyarrow", 
    "scikit-learn",

    # External Data & LLM
    "google-genai", 

    # Utilities
    "python-dotenv",
    "httpx",
    "pydantic",
    "pydantic-settings", 

    # Scheduling
    "apscheduler"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio",
    "mypy",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fin_dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "src"
asyncio_mode = "auto"