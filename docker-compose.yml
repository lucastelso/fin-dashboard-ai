services:
  nginx:
    image: nginx:alpine
    container_name: fin_nginx
    restart: unless-stopped
    ports:
      - "80:80" 
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy # O Nginx só liga se a API estiver respondendo
      frontend:
        condition: service_started
    networks:
      - fin_network

  postgres_db:
    image: postgres:17-bookworm
    container_name: fin_postgres
    restart: unless-stopped
    env_file:
      - .env
    # expose:
    #   - 5432 ## para deploy
    ports:
      - "127.0.0.1:${DB_PORT}:5432"  # para acesso local via pgadmin
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fin_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: fin_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=postgres_db 
      - TZ=America/Sao_Paulo
      - PYTHONPATH=/app/src
      - DB_PORT=5432
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - fin_network

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: 
      context: ./frontend
    container_name: fin_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fin_network

volumes:
  postgres_data:

networks:
  fin_network:
    driver: bridge