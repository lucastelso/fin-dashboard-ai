services:
  postgres_db:
    image: postgres:17-alpine
    container_name: fin_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fin_network
    # Healthcheck é fundamental para o backend não tentar conectar antes do banco estar pronto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: fin_backend
    env_file:
      - .env
    environment:
      - RUNNING_IN_DOCKER=true
    ports:
      - "8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - fin_network

volumes:
  postgres_data: # Define a persistência real dos dados no disco

networks:
  fin_network:
    driver: bridge