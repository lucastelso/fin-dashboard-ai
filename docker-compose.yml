services:
  nginx:
    image: nginx:alpine
    container_name: fin_nginx
    restart: unless-stopped
    ports:
      - "80:80" 
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro # Certificado autossinado adicionado (SSL)
    depends_on:
      - backend
    networks:
      - fin_network

  postgres_db:
    image: postgres:17-bookworm
    container_name: fin_postgres
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - 5432
    # ports:
    #   - "5432:5432"
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fin_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: fin_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=postgres_db # Explícito para o Service Discovery interno
      - TZ=America/Sao_Paulo
      - PYTHONPATH=/app/src
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - fin_network
  frontend:
    build: 
      context: ./frontend
    container_name: fin_frontend
    restart: unless-stopped
    networks:
      - fin_network

volumes:
  postgres_data:

networks:
  fin_network:
    driver: bridge