# 1. BLOCO GLOBAL
# Define o usuário que roda o processo e o número de workers.
# "auto" faz o Nginx detectar o número de núcleos da sua CPU (seu i7 ou Ryzen) 
# e alocar um worker per core, maximizando o bypass do GIL
worker_processes auto;

# 2. BLOCO DE EVENTOS
events {
    worker_connections 1024;
}

# 3. BLOCO HTTP (O coração do tráfego web)
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Otimizações de I/O a nível de kernel (Kernel Sendfile)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Oculta a versão do Nginx nos headers de erro (Prática de Segurança - Obscuridade)
    server_tokens off;

    # 4. BLOCO SERVER (O Host Virtual)
    server {
        # Escuta na porta 80 (HTTP padrão)
        listen 80;
        
        # Em produção, aqui iria o seu domínio: server_name meudashboard.com;
        server_name localhost; 

        # ROTA 1: FRONTEND (React)
        # Qualquer requisição na raiz "/" cai aqui
        location / {
            # O Nginx faz o proxy reverso para o container chamado 'frontend' na porta 3000
            proxy_pass http://frontend:3000;
            
            # Repassa os headers originais para que o React saiba quem está acessando
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # TRUQUE FUNDAMENTAL PARA SINGLE PAGE APPLICATIONS (SPA) como React:
            # Se o usuário der F5 na página "/dashboard", o Nginx vai procurar um arquivo 
            # chamado "dashboard" e dar erro 404. O try_files força o Nginx a redirecionar 
            # tudo de volta para o index.html, deixando o React Router resolver a rota no browser.
            try_files $uri $uri/ /index.html;
        }

        # ROTA 2: BACKEND (FastAPI)
        # Qualquer requisição que comece com "/api/" cai aqui. 
        # É assim que driblamos a política de CORS do navegador.
        location /api/ {
            # Faz o proxy para o container chamado 'backend' na porta 8000
            proxy_pass http://backend:8000;
            
            # HEADERS CRÍTICOS PARA SEGURANÇA E AUDITORIA:
            # Sem isso, o FastAPI vai achar que TODOS os acessos estão vindo do IP do container do Nginx.
            # O X-Real-IP repassa o IP verdadeiro do cliente para os logs e sistemas de rate limit.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Suporte a WebSockets (se no futuro o FastAPI for cuspir cotações em tempo real)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}