# 1. BLOCO GLOBAL
# Define o usuário que roda o processo e o número de workers.
# "auto" faz o Nginx detectar o número de núcleos da sua CPU (seu i7 ou Ryzen) 
# e alocar um worker per core, maximizando o bypass do GIL
worker_processes auto;

# 2. BLOCO DE EVENTOS
events {
    worker_connections 1024;
}

# 3. BLOCO HTTP (O coração do tráfego web)
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Otimizações de I/O a nível de kernel (Kernel Sendfile)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Oculta a versão do Nginx nos headers de erro (Prática de Segurança - Obscuridade)
    server_tokens off;

    # 4. BLOCO SERVER (O Host Virtual)
    server {
        # Escuta na porta 80 (HTTP padrão)
        listen 80;
        
        server_name localhost; 

        # ROTA 1: FRONTEND (React)
        # Qualquer requisição na raiz "/" cai no container do frontend
        location / {
            # O container usa a imagem Nginx (porta 80), não a porta 3000 de dev
            proxy_pass http://fin_frontend:80;
            
            # Repassa os headers originais
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ROTA 2: BACKEND (FastAPI)
        # Qualquer requisição que comece com "/api-financeira/" cai aqui. 
        location /api-financeira/ {
            proxy_pass http://fin_backend:8000;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}